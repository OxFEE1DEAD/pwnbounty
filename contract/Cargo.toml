[package]
name = "sealed-bounty"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.27.0"

[dev-dependencies]
near-sdk = { version = "=5.27.0", features = ["unit-testing"] }
ed25519-dalek = "=2.2.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
