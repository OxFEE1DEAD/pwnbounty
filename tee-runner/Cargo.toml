[package]
name = "sealed-bounty-tee-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[[bin]]
name = "sealed-bounty-tee-runner"
path = "src/main.rs"

[dependencies]
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
hkdf = "=0.12.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
x25519-dalek = "=2.0.1"
curve25519-dalek = "=4.1.3"
ed25519-dalek = "=2.2.0"
chacha20poly1305 = "=0.10.1"
zeroize = "=1.9.1"

[target.'cfg(all(target_arch = "wasm32", target_os = "wasi"))'.dependencies]
wasi = "=0.13.3"
wit-bindgen = "=0.36.0"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
overflow-checks = true
